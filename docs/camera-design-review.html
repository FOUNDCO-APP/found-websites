/* Fixed product camera identity; surrounding review controls remain adaptive. */
#found-camera-review .brand{font-family:Arial,sans-serif;font-size:18px;letter-spacing:.22em;font-weight:700}

#found-camera-review .sun{background:#abbc8c}#found-camera-review .building{background:#8a947d;box-shadow:12px 14px 0 #253c2e}#found-camera-review .roof{background:#263d32}#found-camera-review .window{background:#253e34;border-color:#a2ab90}#found-camera-review .door{background:#455b45}#found-camera-review .ground{background:#1c3326}

<header class="heading"><span class="brand">FOUND</span><span class="tag">CAMERA / DESIGN PROPOSAL</span></header>
<div class="tools" aria-label="Mockup frame layout"><button data-layout="portrait" aria-pressed="true">Portrait mockup</button><button data-layout="horizontal" aria-pressed="false">Horizontal mockup</button></div>
<div class="stage viz-dotted-background"><section class="camera" data-mode="photo" data-state="ready" aria-label="Found camera proposal">
<div class="top"><button class="icon" data-action="close" aria-label="Close preview"><span aria-hidden="true">×</span></button><div class="top-center"><span class="wordmark">FOUND</span><button class="frame-trigger" data-action="frame" aria-expanded="false" aria-controls="found-frame-panel">Frame · 9:16 ▾</button></div><button class="icon light" data-action="light" aria-label="Preview light" aria-pressed="false">☼</button></div>
<div class="preview" role="img" aria-label="Illustrative geometric house; not a camera feed"><div class="scene"><div class="sky"></div><div class="sun"></div><div class="building"></div><div class="roof"></div><div class="window"></div><div class="door"></div><div class="ground"></div><div class="guides"></div></div><div id="found-frame-panel" class="frame-panel" hidden><span>Photo frame · prototype only</span><div class="frame-options"><button data-ratio="9:16" aria-pressed="true">9:16</button><button data-ratio="3:4" aria-pressed="false">3:4</button><button data-ratio="1:1" aria-pressed="false">Square</button></div><span>Phone rotation behavior is unchanged.</span><button class="frame-done" data-action="frame-done">Done</button></div><span class="rec" hidden>● REC 00:00</span><span class="preview-label">Illustrative preview · 9:16</span></div>
<div class="dock"><div class="zoom" aria-label="Illustrative zoom"><button data-zoom="1" aria-pressed="true">1×</button><button data-zoom="2" aria-pressed="false">2×</button></div><div class="modes" aria-label="Capture mode"><button data-mode="photo" aria-pressed="true">Photo</button><button data-mode="video" aria-pressed="false">Video</button></div><div class="status" role="status" aria-live="polite">Ready to take a photo</div><div class="capture"><button class="thumb" data-action="review" aria-label="Review illustrative capture"></button><button class="shutter" data-action="shutter" aria-label="Take illustrative photo"><span class="core"></span></button><button class="icon" data-action="flip" aria-label="Switch illustrative camera">↻</button></div></div>
<div class="sheet" hidden><span class="sheet-copy"></span><button data-action="return">Return to camera proposal</button></div>
</section></div>
<div class="footer"><span>Proposal only · no camera, saving or upload</span><span>Layout frames only · orientation policy undecided</span></div>
<div class="scenarios" aria-label="Local state demonstrations"><button class="scenario" data-state="ready"><span>Ready<small>Photo or Video, with a stable capture dock</small></span><span aria-hidden="true">↗</span></button><button class="scenario" data-state="preparing"><span>Photo → Video while finishing<small>Remember Video; make the wait visible</small></span><span aria-hidden="true">↗</span></button><button class="scenario" data-state="complete"><span>Finish preparation<small>Apply the remembered mode locally</small></span><span aria-hidden="true">↗</span></button><button class="scenario" data-state="recording"><span>Recording<small>Clear stop control, timer and locked mode</small></span><span aria-hidden="true">↗</span></button></div>
<script>
(()=>{const root=document.getElementById('found-camera-review');const camera=root.querySelector('.camera');const status=root.querySelector('.status');let state={layout:'portrait',mode:'photo',phase:'ready',pending:null,zoom:'1',ratio:'9:16',light:false,seconds:0};let timer;const saved=window.openai?.widgetState?.modelContent;if(saved&&['portrait','horizontal'].includes(saved.layout)){state.layout=saved.layout;if(['photo','video'].includes(saved.mode))state.mode=saved.mode;}
function persist(){window.openai?.setWidgetState?.({modelContent:{layout:state.layout,mode:state.mode,phase:state.phase,pending:state.pending},privateContent:null})?.catch(()=>{});}
function render(){root.querySelector('.scene').style.aspectRatio=state.ratio.replace(':','/');root.querySelector('.frame-trigger').textContent='Frame · '+state.ratio+' ▾';root.querySelector('.frame-trigger').disabled=state.phase!=='ready';root.querySelectorAll('[data-ratio]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ratio===state.ratio)));camera.classList.toggle('horizontal',state.layout==='horizontal');camera.dataset.mode=state.mode;camera.dataset.state=state.phase;root.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===state.layout)));root.querySelectorAll('button[data-mode]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode));b.disabled=state.phase==='recording';});root.querySelectorAll('[data-zoom]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.zoom===state.zoom));b.disabled=state.phase!=='ready';});root.querySelector('.guides').style.inset=state.zoom==='2'?'22%':'12%';root.querySelector('.light').setAttribute('aria-pressed',String(state.light));root.querySelector('.light').disabled=state.phase!=='ready';root.querySelector('[data-action=flip]').disabled=state.phase!=='ready';const rec=root.querySelector('.rec');rec.hidden=state.phase!=='recording';rec.textContent='● REC '+String(Math.floor(state.seconds/60)).padStart(2,'0')+':'+String(state.seconds%60).padStart(2,'0');root.querySelector('.preview-label').textContent='Illustrative preview · '+(state.mode==='photo'?state.ratio+' · Photo':'Video frame · illustrative');status.textContent=state.phase==='preparing'?(state.pending==='video'?'Finishing photo… Video is next':'Finishing photo… Photo is next'):state.phase==='recording'?'Recording · tap stop to finish':state.mode==='photo'?'Ready to take a photo':'Ready to record video';const shutter=root.querySelector('.shutter');shutter.disabled=state.phase==='preparing';shutter.setAttribute('aria-label',state.phase==='recording'?'Stop illustrative recording':state.mode==='photo'?'Take illustrative photo':'Start illustrative recording');}
function phase(next){clearInterval(timer);state.phase=next;state.seconds=0;if(next==='recording')timer=setInterval(()=>{state.seconds++;root.querySelector('.rec').textContent='● REC '+String(Math.floor(state.seconds/60)).padStart(2,'0')+':'+String(state.seconds%60).padStart(2,'0');},1000);}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.layout)state.layout=b.dataset.layout;else if(b.dataset.ratio){state.ratio=b.dataset.ratio;root.querySelector('.frame-panel').hidden=true;root.querySelector('.frame-trigger').setAttribute('aria-expanded','false');root.querySelector('.frame-trigger').focus();}else if(b.dataset.zoom)state.zoom=b.dataset.zoom;else if(b.dataset.mode){if(state.phase==='preparing')state.pending=b.dataset.mode;else state.mode=b.dataset.mode;}else if(b.dataset.state){const s=b.dataset.state;if(s==='complete'){if(state.phase==='preparing'){state.mode=state.pending||state.mode;state.pending=null;phase('ready');}}else if(s==='preparing'){state.mode='photo';state.pending='video';phase('preparing');}else if(s==='recording'){state.mode='video';state.pending=null;phase('recording');}else{state.pending=null;phase('ready');}}else{const action=b.dataset.action;if(action==='shutter'){if(state.phase==='recording'){phase('ready');}else if(state.mode==='video')phase('recording');else{state.pending='photo';phase('preparing');}}if(action==='frame'){root.querySelector('.frame-panel').hidden=!root.querySelector('.frame-panel').hidden;root.querySelector('.frame-trigger').setAttribute('aria-expanded',String(!root.querySelector('.frame-panel').hidden));root.querySelector('.frame-options').hidden=state.mode==='video';root.querySelector('.frame-panel > span').textContent=state.mode==='photo'?'Photo frame · prototype only':'Video frame · illustrative only';}if(action==='frame-done'){root.querySelector('.frame-panel').hidden=true;root.querySelector('.frame-trigger').setAttribute('aria-expanded','false');root.querySelector('.frame-trigger').focus();}if(action==='light')state.light=!state.light;if(action==='flip'){root.querySelector('.building').style.left=root.querySelector('.building').style.left==='18%'?'12%':'18%';}if(['review','close'].includes(action)){root.querySelector('.sheet').hidden=false;root.querySelector('.sheet-copy').textContent=action==='review'?'Illustrative capture review · no media is stored.':'Preview only · no working camera to close.';}if(action==='return')root.querySelector('.sheet').hidden=true;}render();persist();});window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;if(s&&['portrait','horizontal'].includes(s.layout)){state.layout=s.layout;render();}});render();})();
</script>
