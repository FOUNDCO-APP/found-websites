name: Build

# Automatic safety net: run the same production build previously only ever
# run by hand, on every push. Uses the Vercel CLI to pull this project's
# real environment variables straight from Vercel instead of duplicating
# every secret into GitHub separately - Vercel stays the single source of
# truth, so adding/rotating a var there is automatically picked up here too,
# with no second copy to keep in sync or let go stale.
#
# Needs 3 GitHub Actions secrets added once (Settings > Secrets and
# variables > Actions): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# See SESSION_HANDOFF.md for the values.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --global vercel@latest

      # production, not preview - a handful of real vars (STRIPE_SECRET_KEY,
      # NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY) are only saved under Production
      # in Vercel, not Preview. Pulling preview left this build missing them
      # and failing. This only affects what the CI build check can read -
      # it doesn't deploy or touch the real production site.
      - name: Pull Vercel environment variables
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build (same pipeline Vercel itself uses)
        run: vercel build --token=$VERCEL_TOKEN
